<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Ведущего Мафии</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎙️ Панель Ведущего Мафии</h1>

        <!-- Блок добавления игрока -->
        <div class="card setup-section">
            <h2>1. Добавить игрока в стол</h2>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Имя или № стола">
                <!-- Заменили инпут на выпадающий список -->
                <select id="playerRoleSelect">
                    <option value="Мирный">Мирный гражданин</option>
                    <option value="Мафия">Мафия</option>
                    <option value="Доктор">Доктор</option>
                </select>
                <button id="addPlayerBtn">Добавить</button>
            </div>
        </div>

        <div class="game-grid">
            <!-- Список игроков -->
            <div class="card players-list-card">
                <h2>👥 Список игроков</h2>
                <div id="playersContainer" class="players-container">
                    <!-- Игроки добавляются через JS -->
                </div>
            </div>

            <!-- Ночные события (динамически управляются через JS) -->
            <div class="card night-actions-card">
                <h2>🌙 Ночные события</h2>

                <div id="nightForm" class="night-form">
                    <!-- Контейнеры для действий активных ролей -->
                    <div id="mafiaActionBlock" class="action-block" style="display: none;">
                        <label for="targetToKill">Кто выбран на убийство (Мафия)?</label>
                        <select id="targetToKill"></select>
                    </div>

                    <div id="doctorActionBlock" class="action-block" style="display: none;">
                        <label for="targetToHeal">Кого лечит Доктор?</label>
                        <select id="targetToHeal"></select>
                    </div>

                    <div id="noActiveRolesMessage" class="no-roles-msg">
                        Нет активных живых ролей для проведения ночи.
                    </div>

                    <button id="processNightBtn" class="btn-night" style="display: none;">☀️ Рассчитать итоги ночи</button>
                </div>

                <div class="log-section">
                    <h3>📜 Журнал событий:</h3>
                    <ul id="gameLog"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
